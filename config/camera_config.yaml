# TUM RGB-D fr1/xyz camera parameters (real-world sequence).
#
# Every key in this file is read by code. Sections that no code consumed
# (Mapping, LoopClosing, and most of LoopClosure) have been removed rather than
# left as decoration -- they gave the false impression of being tunable.
Camera:
  fx: 517.3          # focal length x
  fy: 516.5          # focal length y
  cx: 318.6          # optical centre x
  cy: 255.3          # optical centre y

  # Distortion. These are large for fr1 and MUST be applied consistently:
  # keypoints are undistorted once in tracking.py and the camera is treated as
  # an ideal pinhole thereafter.
  k1: 0.2624
  k2: -0.9531
  p1: -0.0054
  p2: 0.0026
  k3: 1.1633

  width: 640
  height: 480

  depth_scale: 5000.0   # raw depth units per metre (TUM freiburg1)
  fps: 30               # fr1 sequences are recorded at 30 Hz

# ORB feature extraction (read in system.py)
ORB:
  nfeatures: 2000
  scale_factor: 1.2
  nlevels: 8
  edge_threshold: 19
  first_level: 0
  WTA_K: 2
  patch_size: 31
  fast_threshold: 20

# Tracking (read in system.py, passed to Tracker)
Tracking:
  minMatches: 50           # keypoints required before initialisation
  nnRatio: 0.75            # Lowe's ratio test threshold (true 2-NN ratio)
  minPnPInliers: 15        # RANSAC consensus size required to accept a pose
  reprojectionError: 3.0   # px, PnP RANSAC inlier threshold
  depthMin: 0.5            # m, below this the TUM depth sensor is unreliable
  depthMax: 5.0            # m, above this likewise
  # Reference-frame tracking: hold a reference frame and estimate against it
  # rather than chaining a relative pose every frame. DEFAULT OFF.
  # On a 300-frame prefix of fr1/xyz this looked like a clear win (ATE
  # 0.0331 -> 0.0213 m). On the full 796 frames it reverses (ATE 0.0453 ->
  # 0.0482 m, RPE(1) 0.0169 -> 0.0186 m, scale 0.9975 -> 0.9339). The prefix
  # was an easier benchmark, exactly the trap documented in RESULTS.md for the
  # classifier's "easy split". Kept switchable so the result stays checkable.
  useReferenceFrame: false
  referenceThreshold: 0.10

# Loop closure (read in system.py, passed to LiveLoopClosureDetector)
LoopClosure:
  appearanceThreshold: 0.9   # classifier probability required to become a candidate
  minGeometricInliers: 25    # PnP inliers required to accept a verified closure
